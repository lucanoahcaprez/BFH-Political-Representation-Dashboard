server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # Docker embedded DNS (works in user-defined bridge networks / compose)
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Use a variable so nginx resolves at request-time (not startup-time)
    set $api_upstream backend:3000;
    proxy_pass http://$api_upstream;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Make failures fast and predictable
    proxy_connect_timeout 1s;
    proxy_send_timeout 10s;
    proxy_read_timeout 30s;

    # Return a controlled response instead of nginx default HTML error
    proxy_intercept_errors on;
    error_page 502 503 504 = @api_unavailable;
  }

  location @api_unavailable {
    default_type application/json;
    return 503 '{"error":"backend unavailable"}';
  }
}
